<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Job' if job else 'Post a Job' }} - HerSphere</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header><nav><div class="logo">HerSphere</div><ul><li><a href="/employer/dashboard">Dashboard</a></li><li><a href="/employer/jobs">My Jobs</a></li><li><a href="/employer/logout">Logout</a></li></ul></nav></header>
    <main><section class="auth-form">
        <h2>{{ 'Edit Job' if job else 'Post a Job' }}</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash-messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
        <form method="post">
            <div class="form-group"><label for="title">Job Title</label><input id="title" name="title" value="{{ job.title if job else '' }}" required></div>
            <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="5">{{ job.description if job else '' }}</textarea></div>
            <div class="form-group"><label for="skill_required">Required Skill</label><input id="skill_required" name="skill_required" value="{{ job.skill_required if job else '' }}" required></div>
            <div class="form-group"><label for="location">Location</label><input id="location" name="location" value="{{ job.location if job else '' }}"></div>
            <div class="form-group"><label for="job_type">Job Type</label><input id="job_type" name="job_type" placeholder="Full-time, part-time, contract" value="{{ job.job_type if job else '' }}"></div>
            <div class="form-group"><label for="salary">Salary</label><input id="salary" name="salary" value="{{ job.salary if job else '' }}"></div>
            <button type="submit" class="btn">{{ 'Save Changes' if job else 'Post Job' }}</button>
        </form>
    </section></main>
</body>
</html>
